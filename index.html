<style>
:root{--fg:#e9e4d0;--red:#ff2a1f}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:#000;color:var(--fg);font-family:'VT323',monospace}
canvas{display:block}
#hud{position:fixed;inset:0;pointer-events:none;font-size:28px;text-shadow:0 0 2px #000,1px 1px 0 #000;letter-spacing:1px;opacity:.88}

#hud .br{position:absolute;right:44px;bottom:32px;text-align:right}
.dot{display:inline-block;width:14px;height:14px;border-radius:50%;background:var(--red);margin-right:8px;vertical-align:1px}
.blink{animation:b 1s steps(1) infinite}@keyframes b{50%{opacity:0}}
#stam{position:absolute;left:50%;bottom:36px;width:160px;height:4px;margin-left:-80px;background:rgba(255,255,255,.15);opacity:0;transition:opacity .4s}
#stam i{display:block;height:100%;background:var(--fg)}
#msg{position:absolute;left:0;right:0;top:58%;text-align:center;font-size:30px;opacity:0;transition:opacity .3s}
.ov{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#000;text-align:center;padding:16px;z-index:5}
.ov h1{font-size:clamp(64px,12vw,140px);margin:0;font-weight:400;letter-spacing:6px}
.ov p{font-size:24px;max-width:640px;line-height:1.25;color:#b9b39c;margin:10px 0}
.ov .k{color:var(--fg)}
.ov button{margin-top:28px;font:inherit;font-size:30px;background:none;color:var(--fg);border:1px solid var(--fg);padding:8px 34px;cursor:pointer;letter-spacing:3px}
.ov button:hover{background:var(--fg);color:#000}
#load{font-size:22px;color:#777;margin-top:14px}
.hide{display:none!important}
</style>

<body>

<div id="start" class="ov">
  <h1>LEVEL 0</h1>
  <p>You fell through the floor of the world. Mono-yellow rooms, damp carpet, the hum of fluorescent lights. Nothing else. Almost.</p>
  <p>Find an <span class="k">EXIT</span>. Don't let it find you.</p>
  <p class="k">WASD move &middot; MOUSE look &middot; SHIFT run &middot; E interact</p>

<script type="module">
import * as THREE from 'three';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { ShaderPass } from 'three/addons/postprocessing/ShaderPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';
import { mergeGeometries } from 'three/addons/utils/BufferGeometryUtils.js';

// ---------- world constants ----------
const C = 3.6, H = 2.7, T = 0.17, CH = 8, P = 0.6, EYE = 1.62;
const $ = id => document.getElementById(id);

// ---------- hashing / noise ----------
function hash(x, z, s) {
  let h = (Math.imul(x, 374761393) + Math.imul(z, 668265263) + Math.imul(s, 1442695041)) | 0;
  h = Math.imul(h ^ (h >>> 13), 1274126177); h ^= h >>> 16;
  return (h >>> 0) / 4294967296;
}
function vnoise(x, z, s = 0) {
  const xi = Math.floor(x), zi = Math.floor(z), fx = x - xi, fz = z - zi;
  const u = fx * fx * (3 - 2 * fx), v = fz * fz * (3 - 2 * fz);
  const a = hash(xi, zi, s), b = hash(xi + 1, zi, s), c = hash(xi, zi + 1, s), d = hash(xi + 1, zi + 1, s);
  return a + (b - a) * u + (c - a) * v + (a - b - c + d) * u * v;
}

// ---------- level layout ----------
const nearSpawn = (x, z) => x >= -2 && x <= 1 && z >= -2 && z <= 1;
const region = (x, z) => vnoise(x * 0.13, z * 0.13, 5);
const region2 = (x, z) => vnoise(x * 0.08 + 100, z * 0.08 - 50, 9);
const isExit = (x, z) => x * x + z * z > 28 * 28 && hash(x, z, 77) < 0.0006;
function edgeKind(on, x, z, s) {
  const h = hash(x, z, s + 30);
  if (on) return h < 0.55 ? 1 : h < 0.8 ? 2 : 3;
  return h < 0.3 ? 4 : 0;
}
function rawE(x, z) {
  if (nearSpawn(x, z)) return false;
  const r = region(x, z);
  if (region2(x, z) > 0.68) return (((x % 2) + 2) % 2 === 0) && hash(x, z, 11) < 0.82;
  if (r < 0.2) return false;
  return hash(x, z, 1) < 0.3 + 0.35 * (r - 0.2) / 0.8;
}
function rawS(x, z) {
  if (nearSpawn(x, z)) return false;
  const r = region(x, z);
  if (region2(x, z) > 0.68) return hash(x, z, 12) < 0.07;
  if (r < 0.2) return false;
  return hash(x, z, 2) < 0.3 + 0.35 * (r - 0.2) / 0.8;
}
const kindE = (x, z) => isExit(x, z) ? 1 : (nearSpawn(x, z) ? 0 : edgeKind(rawE(x, z), x, z, 1));
const kindS = (x, z) => nearSpawn(x, z) ? 0 : edgeKind(rawS(x, z), x, z, 2);
const blocks = k => k === 1 || k === 3;
const wallE = (x, z) => blocks(kindE(x, z));
const wallS = (x, z) => blocks(kindS(x, z));
function pillar(x, z) {
  if (nearSpawn(x, z) && !(x === -2 || z === -2)) return false;
  return region(x, z) < 0.2 ? hash(x, z, 3) < 0.5 : hash(x, z, 4) < 0.08;
}

// ---------- texture generation ----------
function tnoise(x, y, per, s) { // tileable value noise
  const xi = Math.floor(x), yi = Math.floor(y), fx = x - xi, fy = y - yi;
  const u = fx * fx * (3 - 2 * fx), v = fy * fy * (3 - 2 * fy);
  const m = k => ((k % per) + per) % per;
  const a = hash(m(xi), m(yi), s), b = hash(m(xi + 1), m(yi), s), c = hash(m(xi), m(yi + 1), s), d = hash(m(xi + 1), m(yi + 1), s);
  return a + (b - a) * u + (c - a) * v + (a - b - c + d) * u * v;
}
function fbm(x, y, per, oct, s) {
  let f = 0, a = 0.5, n = 0;
  for (let i = 0; i < oct; i++) { f += a * tnoise(x, y, per, s + i); n += a; x *= 2; y *= 2; per *= 2; a *= 0.5; }
  return f / n;
}
function canvas(w, h) { const c = document.createElement('canvas'); c.width = w; c.height = h; return c; }
function normalFrom(height, w, h, strength) {
  const c = canvas(w, h), ctx = c.getContext('2d'), img = ctx.createImageData(w, h), d = img.data;
  for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) {
    const l = height[y * w + ((x - 1 + w) % w)], r = height[y * w + ((x + 1) % w)];
    const u = height[((y - 1 + h) % h) * w + x], dn = height[((y + 1) % h) * w + x];
    let nx = (l - r) * strength, ny = (dn - u) * strength, nz = 1;
    const len = Math.hypot(nx, ny, nz); nx /= len; ny /= len; nz /= len;
    const i = (y * w + x) * 4;
    d[i] = (nx * 0.5 + 0.5) * 255; d[i + 1] = (ny * 0.5 + 0.5) * 255; d[i + 2] = (nz * 0.5 + 0.5) * 255; d[i + 3] = 255;
  }
  ctx.putImageData(img, 0, 0); return c;
}

function wallpaperTex() {
  // recreation of the classic Level 0 paper: stripe bands with teardrop dots + staggered flame-stitch chevrons
  const W = 1024, Hh = 1024, PER = 256, c = canvas(W, Hh), g = c.getContext('2d'), img = g.createImageData(W, Hh), d = img.data, hgt = new Float32Array(W * Hh);
  const BASE = [214, 198, 104], DARK = [203, 186, 92], LIGHT = [224, 210, 124], CHEV = [206, 189, 95], FLECK = [220, 205, 115];
  for (let y = 0; y < Hh; y++) for (let x = 0; x < W; x++) {
    const i = y * W + x, k = i * 4, px = x % PER, col = Math.floor(x / PER);
    let cl = BASE, hh = 0.5;
    if (px < 5 || (px >= 44 && px < 47) || (px >= 247 && px < 251)) { cl = LIGHT; hh = 0.7; }
    else if ((px >= 51 && px < 54) || px >= 252) { cl = DARK; hh = 0.35; }
    else if (px >= 9 && px < 40) { // dotted band
      cl = DARK; hh = 0.3;
      const by = y % 128, bx = px - 24.5, dy = by - 64;
      // teardrop: pointed top
      const w = dy < 0 ? (1 + dy / 22) * 7 : Math.sqrt(Math.max(0, 1 - (dy / 12) ** 2)) * 7;
      if (dy > -22 && dy < 12 && Math.abs(bx) < w) { cl = LIGHT; hh = 0.75; }
      else if (Math.abs(bx) < 11 && Math.abs(((y + 64) % 128) - 64 - Math.abs(bx) * 1.6 + 20) < 6) { cl = CHEV; }
    } else if (px >= 56 && px < 245) { // field with flame chevrons
      const fx = px - 150.5, off = (col % 2) * 256 + ((Math.floor((x - 56) / 4)) % 2) * 0;
      const yy = ((y - off) % 512 + 512) % 512;
      const step = Math.floor(px / 5), jag = (hash(step, Math.floor(yy / 512) + col, 9) - 0.5) * 18;
      const v = yy - Math.abs(fx) * 0.95 - 60;
      if (Math.abs(fx) < 94) {
        if (v > 0 && v < 46 + jag) { cl = CHEV; hh = 0.4; }
        else if (v > 70 && v < 112 + jag) { cl = CHEV; hh = 0.4; }
        else if (v >= 112 + jag && v < 128 + jag && hash(x >> 1, y >> 1, 21) < 0.55) { cl = FLECK; hh = 0.6; }
        else if (v >= 46 + jag && v < 54 + jag && hash(x >> 1, y >> 1, 22) < 0.4) { cl = FLECK; hh = 0.6; }
      }
    }
    const fib = 0.985 + 0.03 * fbm(x / 2.5, y / 30, 410, 3, 20) + (hash(x, y, 7) - 0.5) * 0.015;
    d[k] = cl[0] * fib; d[k + 1] = cl[1] * fib; d[k + 2] = cl[2] * fib; d[k + 3] = 255;
    hgt[i] = hh + fib * 0.3;
  }
  g.putImageData(img, 0, 0);
  return { map: c, normal: normalFrom(hgt, W, Hh, 1.0) };
}

function carpetTex() {
  const W = 1024, c = canvas(W, W), g = c.getContext('2d'), img = g.createImageData(W, W), d = img.data, hgt = new Float32Array(W * W);
  for (let y = 0; y < W; y++) for (let x = 0; x < W; x++) {
    const i = y * W + x, k = i * 4;
    const f = hash(x, y, 3), f2 = hash(x >> 1, y >> 1, 4);
    const soft = 0.97 + 0.05 * fbm(x / 48, y / 48, 21, 3, 70);
    const m = (0.94 + 0.05 * f + 0.04 * f2) * soft;
    d[k] = 214 * m; d[k + 1] = 197 * m; d[k + 2] = 148 * m; d[k + 3] = 255;
    hgt[i] = f * 0.5 + f2 * 0.5;
  }
  g.putImageData(img, 0, 0);
  return { map: c, normal: normalFrom(hgt, W, W, 0.9) };
}

function ceilingTex() {
  // covers 4.8m x 4.8m, tiles 0.6 (x) by 1.2 (z) => 8 x 4 tiles
  const W = 2048, c = canvas(W, W), g = c.getContext('2d'), img = g.createImageData(W, W), d = img.data, hgt = new Float32Array(W * W);
  const tw = W / 8, th = W / 4, bar = 4;
  for (let y = 0; y < W; y++) for (let x = 0; x < W; x++) {
    const i = y * W + x, k = i * 4;
    const lx = x % tw, ly = y % th;
    const dEdge = Math.min(lx, tw - lx, ly, th - ly);
    let m, h;
    if (dEdge < bar) { m = dEdge < 1.5 ? 0.86 : 0.95; h = 1; }
    else {
      const pin = hash(x, y, 13) < 0.02 ? 0.9 : 1;
      const tex = 0.975 + 0.04 * fbm(x / 5, y / 5, 410, 3, 30);
      const sh = dEdge < bar + 6 ? 0.95 + 0.05 * (dEdge - bar) / 6 : 1;
      m = pin * tex * sh; h = 0.4 * tex + (pin < 1 ? -0.2 : 0);
    }
    d[k] = 232 * m; d[k + 1] = 222 * m; d[k + 2] = 176 * m; d[k + 3] = 255; hgt[i] = h;
  }
  g.putImageData(img, 0, 0);
  return { map: c, normal: normalFrom(hgt, W, W, 1.0) };
}

function doorTex() {
  const c = canvas(256, 512), g = c.getContext('2d');
  g.fillStyle = '#3b2e22'; g.fillRect(0, 0, 256, 512);
  g.fillStyle = '#4a3a2a'; g.fillRect(14, 14, 228, 498);
  for (let i = 0; i < 300; i++) { g.fillStyle = `rgba(20,12,6,${Math.random() * 0.08})`; g.fillRect(14 + Math.random() * 228, 14, 1 + Math.random() * 2, 498); }
  g.strokeStyle = 'rgba(0,0,0,.35)'; g.lineWidth = 3; g.strokeRect(40, 50, 176, 170); g.strokeRect(40, 270, 176, 200);
  g.fillStyle = '#b8a77a'; g.fillRect(200, 260, 26, 10);
  return c;
}
function exitTex() {
  const c = canvas(256, 96), g = c.getContext('2d');
  g.fillStyle = '#1a0503'; g.fillRect(0, 0, 256, 96);
  g.fillStyle = '#ff3322'; g.font = 'bold 70px Arial'; g.textAlign = 'center'; g.textBaseline = 'middle'; g.fillText('EXIT', 128, 52);
  return c;
}

// ---------- renderer ----------
const renderer = new THREE.WebGLRenderer({ antialias: false, powerPreference: 'high-performance' });
renderer.setPixelRatio(Math.min(devicePixelRatio, 1.5));
renderer.setSize(innerWidth, innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.12;
document.body.prepend(renderer.domElement);

const scene = new THREE.Scene();
const FOG = new THREE.Color(0xd8c87a);
scene.background = FOG;
scene.fog = new THREE.FogExp2(FOG, 0.01);
const camera = new THREE.PerspectiveCamera(68, innerWidth / innerHeight, 0.05, 120);
camera.rotation.order = 'YXZ';

scene.add(new THREE.HemisphereLight(0xffeeb8, 0xe0c870, 0.42));

// lamp state table (64x64 wrap): r=on brightness, g=flicker, b=phase
const lampData = new Uint8Array(64 * 64 * 4);
for (let z = 0; z < 64; z++) for (let x = 0; x < 64; x++) {
  const i = (z * 64 + x) * 4, h1 = hash(x, z, 500);
  lampData[i] = (x % 2 === 1 || h1 < 0.07) ? 0 : 215 + hash(x, z, 501) * 40;
  lampData[i + 1] = hash(x, z, 502) < 0.03 ? 255 : 0;
  lampData[i + 2] = hash(x, z, 503) * 255; lampData[i + 3] = 255;
}
lampData[0] = 240; lampData[1] = 0; // spawn lamp always on
const lampTex = new THREE.DataTexture(lampData, 64, 64, THREE.RGBAFormat);
lampTex.magFilter = lampTex.minFilter = THREE.NearestFilter; lampTex.needsUpdate = true;

const U = {
  uLampTex: { value: lampTex }, uTime: { value: 0 }, uGlobal: { value: 1 }, uLampI: { value: 10.0 },
};
const LAMP_GLSL = `
uniform sampler2D uLampTex; uniform float uTime; uniform float uGlobal; uniform float uLampI;
float wh3(vec3 p){ return fract(sin(dot(p, vec3(127.1, 311.7, 74.7))) * 43758.5453); }
float wn3(vec3 p){ vec3 i = floor(p), f = fract(p); f = f * f * (3.0 - 2.0 * f);
  return mix(mix(mix(wh3(i), wh3(i + vec3(1,0,0)), f.x), mix(wh3(i + vec3(0,1,0)), wh3(i + vec3(1,1,0)), f.x), f.y),
             mix(mix(wh3(i + vec3(0,0,1)), wh3(i + vec3(1,0,1)), f.x), mix(wh3(i + vec3(0,1,1)), wh3(i + vec3(1,1,1)), f.x), f.y), f.z); }
float lampState(vec2 c){
  vec4 t = texture2D(uLampTex, (mod(c, 64.0) + 0.5) / 64.0);
  float s = t.r;
  if (t.g > 0.5) {
    float k = floor(uTime * (7.0 + t.b * 12.0) + t.b * 50.0);
    float f = fract(sin(k * 12.9898 + t.b * 78.233) * 43758.5453);
    s *= f > 0.5 ? 1.0 : (f > 0.25 ? 0.3 : 0.0);
  }
  return s * uGlobal;
}`;

function patchLit(mat, isWall) {
  mat.onBeforeCompile = sh => {
    Object.assign(sh.uniforms, U);
    sh.vertexShader = 'varying vec3 vWPos;\n' + sh.vertexShader.replace('#include <project_vertex>',
      '#include <project_vertex>\n vWPos = (modelMatrix * vec4(transformed, 1.0)).xyz;');
    sh.fragmentShader = 'varying vec3 vWPos;\n' + LAMP_GLSL + '\n' + sh.fragmentShader.replace('#include <map_fragment>', `#include <map_fragment>
  { float gn = wn3(vWPos * 0.45) * 0.6 + wn3(vWPos * 1.7) * 0.4; float gs = wn3(vWPos * 0.12 + 7.0);
    diffuseColor.rgb *= mix(0.96, 1.02, gn) + 0.0 * gs; }`).replace('#include <lights_fragment_end>', `
#include <lights_fragment_end>
{
  vec3 wN = normalize(inverseTransformDirection(normal, viewMatrix));
  vec2 cell = floor(vWPos.xz / ${C.toFixed(2)});
  vec3 acc = vec3(0.0); float bnc = 0.0;
  for (int i = -2; i <= 2; i++) for (int j = -2; j <= 2; j++) {
    vec2 c = cell + vec2(float(i), float(j));
    float s = lampState(c);
    if (s <= 0.001) continue;
    vec3 lp = vec3((c.x + 0.5) * ${C.toFixed(2)}, ${(H - 0.04).toFixed(2)}, (c.y + 0.5) * ${C.toFixed(2)});
    vec3 L = lp - vWPos; float d2 = dot(L, L); float d = sqrt(d2); L /= d;
    float ce = max(L.y, 0.0);
    ce = ce * 0.85 + 0.15 * step(0.0001, ce);
    float cr = max(dot(wN, L), 0.0);
    float wnd = 1.0 - smoothstep(4.2, 7.0, length(L.xz * d));
    acc += wnd * s * ce * cr / (d2 + 0.6);
    bnc += wnd * s / (d2 + 7.0);
  }
  float ao = 1.0;
  ${isWall ? `ao = mix(0.72, 1.0, smoothstep(0.0, 0.5, vWPos.y)) * mix(0.82, 1.0, smoothstep(${H.toFixed(2)}, ${(H - 0.35).toFixed(2)}, vWPos.y));` : ''}
  vec3 lampCol = vec3(1.0, 0.91, 0.66);
  reflectedLight.directDiffuse += acc * lampCol * uLampI * BRDF_Lambert(material.diffuseColor) * ao;
  reflectedLight.indirectDiffuse += bnc * vec3(1.0, 0.9, 0.66) * uLampI * 1.1 * BRDF_Lambert(material.diffuseColor) * ao;
  reflectedLight.indirectDiffuse *= ao * (0.55 + 0.45 * uGlobal);
}`);
  };
}

const maxAniso = renderer.capabilities.getMaxAnisotropy();
function tex(c, srgb) {
  const t = new THREE.CanvasTexture(c);
  t.wrapS = t.wrapT = THREE.RepeatWrapping; t.anisotropy = maxAniso;
  if (srgb) t.colorSpace = THREE.SRGBColorSpace;
  return t;
}

let seatMat, railMat, wallMat, floorMat, ceilMat, doorMat, exitMat;
const panelMat = new THREE.ShaderMaterial({
  uniforms: { ...U, uFogColor: { value: FOG }, uFogD: { value: 0.01 } },
  vertexShader: `
    varying vec2 vUv; varying vec3 vWPos; varying vec3 vCenter; varying float vDepth; varying vec3 vN;
    void main(){
      vUv = uv; vN = normal;
      vec4 wp = modelMatrix * instanceMatrix * vec4(position, 1.0);
      vWPos = wp.xyz; vCenter = (modelMatrix * instanceMatrix * vec4(0.0, 0.0, 0.0, 1.0)).xyz;
      vec4 mv = viewMatrix * wp; vDepth = -mv.z; gl_Position = projectionMatrix * mv;
    }`,
  fragmentShader: LAMP_GLSL + `
    uniform vec3 uFogColor; uniform float uFogD;
    varying vec2 vUv; varying vec3 vWPos; varying vec3 vCenter; varying float vDepth; varying vec3 vN;
    void main(){
      float s = lampState(floor(vCenter.xz / ${C.toFixed(2)}));
      vec2 q = abs(vUv - 0.5) * 2.0;
      float frame = step(0.9, max(q.x, q.y * 1.0));
      float prism = 0.92 + 0.08 * sin(vUv.x * 160.0) * sin(vUv.y * 320.0);
      float tubes = 0.85 + 0.15 * smoothstep(0.7, 0.0, abs(fract(vUv.x * 2.0) - 0.5) * 2.0);
      vec3 on = vec3(1.0, 0.95, 0.82) * 4.2 * prism * tubes;
      vec3 off = vec3(0.34, 0.33, 0.29);
      vec3 col = mix(off, on, s);
      if (frame > 0.5 || vN.y > 0.5 || abs(vN.y) < 0.5) col = vec3(0.55, 0.53, 0.47) * (0.4 + 0.6 * s * 0.6);
      float f = 1.0 - exp(-uFogD * uFogD * vDepth * vDepth);
      gl_FragColor = vec4(mix(col, uFogColor, f), 1.0);
      #include <tonemapping_fragment>
      #include <colorspace_fragment>
    }`,
});
panelMat.toneMapped = true;
const panelGeo = new THREE.BoxGeometry(0.6, 0.04, 1.2);

function footstep(run) {
  if (!AC) return;
  const s = AC.createBufferSource(); s.buffer = stepBuf; s.playbackRate.value = 0.8 + Math.random() * 0.3;
  const f = AC.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = 380 + Math.random() * 260;
  const g = AC.createGain(), t = AC.currentTime, v = run ? 0.55 : 0.32;
  g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(v, t + 0.012); g.gain.exponentialRampToValueAtTime(0.001, t + 0.16);
  s.connect(f).connect(g); g.connect(master); g.connect(verb); s.start(t, Math.random(), 0.2);
}
function distantSound() {
  if (!AC) return;
  const s = AC.createBufferSource(); s.buffer = stepBuf;
  const f = AC.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = 160 + Math.random() * 200;
  const pan = AC.createStereoPanner(); pan.pan.value = Math.random() * 2 - 1;
  const g = AC.createGain(), t = AC.currentTime, n = 1 + ((Math.random() * 3) | 0);
  g.gain.setValueAtTime(0, t);
  for (let i = 0; i < n; i++) { const tt = t + i * (0.35 + Math.random() * 0.2); g.gain.linearRampToValueAtTime(0.5, tt + 0.01); g.gain.exponentialRampToValueAtTime(0.001, tt + 0.3); }
  s.connect(f).connect(g).connect(pan); pan.connect(verb); s.start(t, 0, 2);
}

// ---------- post ----------
const rt = new THREE.WebGLRenderTarget(innerWidth, innerHeight, { type: THREE.HalfFloatType, samples: 4 });
const composer = new EffectComposer(renderer, rt);
composer.setPixelRatio(renderer.getPixelRatio());
composer.addPass(new RenderPass(scene, camera));
const bloom = new UnrealBloomPass(new THREE.Vector2(innerWidth, innerHeight), 0.22, 0.45, 0.97);
composer.addPass(bloom);
composer.addPass(new OutputPass());
const film = new ShaderPass({
  uniforms: { tDiffuse: { value: null }, uTime: { value: 0 }, uFear: { value: 0 }, uRes: { value: new THREE.Vector2(innerWidth, innerHeight) } },
  vertexShader: 'varying vec2 vUv; void main(){ vUv = uv; gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }',
  fragmentShader: `
    uniform sampler2D tDiffuse; uniform float uTime, uFear; uniform vec2 uRes; varying vec2 vUv;
    float h(vec2 p){ return fract(sin(dot(p, vec2(12.9898, 78.233))) * 43758.5453); }
    void main(){
      vec2 c = vUv - 0.5; float r2 = dot(c, c);
      vec2 uv = 0.5 + c * (1.0 - 0.06 * r2);
      float line = floor(uv.y * 220.0);
      float g = step(0.992 - uFear * 0.12, h(vec2(line, floor(uTime * 24.0))));
      uv.x += g * (h(vec2(line, uTime)) - 0.5) * (0.012 + 0.05 * uFear);
      uv.x += sin(uv.y * 9.0 + uTime * 1.3) * 0.0006;
      float ca = 0.0004 + 0.0025 * r2 + uFear * 0.008;
      vec3 col = vec3(texture2D(tDiffuse, uv + c * ca).r, texture2D(tDiffuse, uv).g, texture2D(tDiffuse, uv - c * ca).b);
      float l = dot(col, vec3(0.299, 0.587, 0.114));
      col = mix(vec3(l), col, 0.96 - uFear * 0.6);
      col = col * vec3(1.0, 1.0, 0.94);
      col += (h(floor(vUv * uRes / 1.5) + fract(uTime * 7.0) * 113.0) - 0.5) * (0.022 + uFear * 0.3);
      col *= 0.992 + 0.008 * sin(vUv.y * uRes.y * 1.6);
      col *= 1.0 - r2 * 0.55;
      gl_FragColor = vec4(col, 1.0);
    }`,
});
composer.addPass(film);

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight); composer.setSize(innerWidth, innerHeight);
  film.uniforms.uRes.value.set(innerWidth, innerHeight);
});

// ---------- player / input ----------
const player = { x: C * 0.5, z: C * 0.5, yaw: Math.PI * 0.75, pitch: 0, vx: 0, vz: 0, stam: 1, bob: 0, lastStep: 0, dist: 0, t: 0 };
const keys = {};
let state = 'menu';
addEventListener('keydown', e => { keys[e.code] = true; if (e.code === 'KeyE') tryExit(); });
addEventListener('keyup', e => { keys[e.code] = false; });
addEventListener('mousemove', e => {
  if (document.pointerLockElement !== renderer.domElement || state !== 'play') return;
  player.yaw -= e.movementX * 0.0021; player.pitch -= e.movementY * 0.0021;
  player.pitch = Math.max(-1.45, Math.min(1.45, player.pitch));
});
document.addEventListener('pointerlockchange', () => {
  if (document.pointerLockElement !== renderer.domElement && state === 'play') {
    state = 'pause'; $('start').classList.remove('hide'); $('go').textContent = 'RESUME';
  }
});
function lock() { renderer.domElement.requestPointerLock(); }
$('go').onclick = () => {
  if (!AC) initAudio(); AC.resume();
  $('start').classList.add('hide'); $('hud').classList.remove('hide'); state = 'play'; lock();
};
renderer.domElement.addEventListener('click', () => { if (state === 'play') lock(); });
$('again').onclick = () => location.reload();

function nearExit() { for (const e of exits) if (Math.hypot(player.x - e.x, player.z - e.z) < 1.3) return e; return null; }
function tryExit() {
  if (state !== 'play' || !nearExit()) return;
  end('NOCLIPPED', `You found a way out after ${fmt(player.t)} and ${Math.round(player.dist)} meters. Probably.`);
}
function die() {
  if (state !== 'play') return;
  state = 'dying'; film.uniforms.uFear.value = 1;
  if (AC) { entGain.gain.setTargetAtTime(1.2, AC.currentTime, 0.02); humGain.gain.setTargetAtTime(0, AC.currentTime, 0.05); }
  // face it
  const a = Math.atan2(-(ent.x - player.x), -(ent.z - player.z));
  player.yaw = a; player.pitch = 0.12;
  setTimeout(() => end('FOUND', `It found you after ${fmt(player.t)}. You walked ${Math.round(player.dist)} meters of Level 0.`), 1100);
}
function end(t, s) {
  state = 'end'; document.exitPointerLock();
  if (AC) master.gain.setTargetAtTime(0, AC.currentTime, 0.1);
  $('endT').textContent = t; $('endS').textContent = s; $('end').classList.remove('hide'); $('hud').classList.add('hide');
}
const fmt = s => `${Math.floor(s / 60)}:${String(Math.floor(s % 60)).padStart(2, '0')}`;

// ---------- events ----------
let globalEvt = 50 + Math.random() * 60, sndEvt = 15 + Math.random() * 30, flickT = -1;

// ---------- loop ----------
const clock = new THREE.Clock();
let time = 0;
function frame() {
  requestAnimationFrame(frame);
  const dt = Math.min(clock.getDelta(), 0.05);
  time += dt; U.uTime.value = time; film.uniforms.uTime.value = time;

  if (state === 'play') {
    player.t += dt;
    const fw = (keys.KeyW || keys.ArrowUp ? 1 : 0) - (keys.KeyS || keys.ArrowDown ? 1 : 0);
    const st = (keys.KeyD || keys.ArrowRight ? 1 : 0) - (keys.KeyA || keys.ArrowLeft ? 1 : 0);
    const moving = fw || st;
    const run = keys.ShiftLeft && moving && player.stam > 0.02 && fw > 0;
    player.stam = Math.max(0, Math.min(1, player.stam + (run ? -dt / 6 : dt / 9)));
    const sp = run ? 4.7 : 2.5;
    const sy = Math.sin(player.yaw), cy = Math.cos(player.yaw);
    let wx = -sy * fw + cy * st, wz = -cy * fw - sy * st; const wl = Math.hypot(wx, wz) || 1;
    wx = wx / wl * sp * (moving ? 1 : 0); wz = wz / wl * sp * (moving ? 1 : 0);
    const k = 1 - Math.exp(-dt * 9);
    player.vx += (wx - player.vx) * k; player.vz += (wz - player.vz) * k;
    const ox = player.x, oz = player.z;
    player.x += player.vx * dt; player.z += player.vz * dt;
    collide(player, 0.3);
    const moved = Math.hypot(player.x - ox, player.z - oz); player.dist += moved;
    player.bob += moved * (run ? 1.9 : 2.3);
    const stepPhase = Math.floor(player.bob / Math.PI);
    if (stepPhase !== player.lastStep) { player.lastStep = stepPhase; footstep(run); }
    $('stam').style.opacity = player.stam < 0.99 ? 1 : 0; $('stam').firstChild.style.width = (player.stam * 100) + '%';

    bfsTimer -= dt; if (bfsTimer <= 0) { bfs(); bfsTimer = 0.35; }
    updateEntity(dt);

    // events
    globalEvt -= dt;
    if (globalEvt <= 0) { flickT = 0; globalEvt = 45 + Math.random() * 70; }
    sndEvt -= dt; if (sndEvt <= 0) { distantSound(); sndEvt = 20 + Math.random() * 45; }
    const ne = nearExit(); $('msg').style.opacity = ne ? 1 : 0; if (ne) $('msg').textContent = '[E] OPEN';
    $('tc').textContent = `0:${String(Math.floor(player.t / 60)).padStart(2, '0')}:${String(Math.floor(player.t % 60)).padStart(2, '0')}`;
    $('dist').textContent = Math.round(player.dist) + ' M';
  }

  // global power flicker
  let gl = 1;
  if (flickT >= 0) {
    flickT += dt;
    const seq = [0.15, 1, 0.05, 0.6, 0, 0, 0, 1, 0.2, 1];
    const i = Math.floor(flickT / 0.18);
    if (i < seq.length) gl = seq[i]; else flickT = -1;
  }
  if (ent.pathD <= 3 && state === 'play') gl *= 0.55 + 0.45 * (Math.sin(time * 37) > -0.3 ? 1 : 0);
  U.uGlobal.value += (gl - U.uGlobal.value) * Math.min(1, dt * 30);

  const fear = state === 'dying' ? 1 : Math.max(0, 1 - ent.pathD / 9);
  film.uniforms.uFear.value += (fear - film.uniforms.uFear.value) * Math.min(1, dt * 3);
  if (AC && state === 'play') {
    entGain.gain.setTargetAtTime(fear * fear * 0.9, AC.currentTime, 0.2);
    humGain.gain.setTargetAtTime(0.07 * U.uGlobal.value, AC.currentTime, 0.03);
  }

  // camera
  const sway = state === 'dying' ? 0.03 : 0.004;
  camera.position.set(player.x, EYE + Math.sin(player.bob) * 0.035 + Math.sin(time * 1.3) * 0.004, player.z);
  camera.rotation.y = player.yaw + Math.sin(time * 0.7) * sway + Math.cos(player.bob * 0.5) * 0.004;
  camera.rotation.x = player.pitch + Math.sin(time * 0.9) * sway * 0.8 + Math.abs(Math.cos(player.bob)) * 0.003;
  camera.rotation.z = Math.sin(player.bob * 0.5) * 0.006 + Math.sin(time * 0.5) * 0.003;
  if (state === 'dying') { camera.position.x += (Math.random() - 0.5) * 0.05; camera.position.y += (Math.random() - 0.5) * 0.05; }

  updateChunks(false);
  composer.render();
}

// ---------- boot ----------
setTimeout(() => {
  const w = wallpaperTex(), cp = carpetTex(), ce = ceilingTex();
  wallMat = new THREE.MeshStandardMaterial({ map: tex(w.map, true), normalMap: tex(w.normal), normalScale: new THREE.Vector2(0.35, 0.35), roughness: 0.9 });
  floorMat = new THREE.MeshStandardMaterial({ map: tex(cp.map, true), normalMap: tex(cp.normal), normalScale: new THREE.Vector2(0.5, 0.5), roughness: 1 });
  ceilMat = new THREE.MeshStandardMaterial({ map: tex(ce.map, true), normalMap: tex(ce.normal), normalScale: new THREE.Vector2(0.7, 0.7), roughness: 0.95 });
  railMat = new THREE.MeshStandardMaterial({ color: 0x9a5f30, roughness: 0.5 });
  seatMat = new THREE.MeshStandardMaterial({ color: 0x4f6466, roughness: 0.8 });
  doorMat = new THREE.MeshStandardMaterial({ map: tex(doorTex(), true), roughness: 0.7 });
  exitMat = new THREE.MeshBasicMaterial({ map: tex(exitTex(), true), color: new THREE.Color(3, 3, 3) });
  [wallMat, floorMat, ceilMat, doorMat, railMat, seatMat].forEach((m, i) => patchLit(m, i === 0));
  updateChunks(true);
  $('load').textContent = '';
  if (location.hash === '#shot') { state = 'play'; window.__ready = true; }
  frame();
}, 30);
window.__dbg = { player, U, film, renderer, scene };
renderer.debug.onShaderError = (gl, prog, vs, fs) => { console.error('SHADERERR ' + gl.getShaderInfoLog(fs) + ' || ' + gl.getShaderInfoLog(vs)); };
</script>
</body>
</html>
